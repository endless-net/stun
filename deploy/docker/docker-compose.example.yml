services:
  stun:
    image: ghcr.io/endless-net/stun-public:v1.0.7
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    environment:
      ENDLESSNET_STUN_ADDRS: 0.0.0.0:3478
      ENDLESSNET_STUN_METRICS_ADDR: 127.0.0.1:9090
      ENDLESSNET_STUN_RATE_LIMIT_PER_SECOND: "20"
      ENDLESSNET_STUN_RATE_LIMIT_BURST: "40"
      ENDLESSNET_STUN_LOG_LEVEL: info
    network_mode: host
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=1m,mode=1777
