name: Release

on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write
  packages: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - name: Validate semantic version
        shell: bash
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
      - name: Verify merged PR provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-production-provenance.sh --version "$GITHUB_REF_NAME"
      - name: Verify release source
        run: ./scripts/verify.sh
      - name: Require exact-commit product E2E
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-e2e-evidence.sh "$(git rev-parse HEAD)"
      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ldflags="-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA} -X main.buildDate=${build_date}"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "$ldflags" -o "dist/endlessnet-stun_${GITHUB_REF_NAME}_linux_${arch}" ./cmd/endlessnet-stun
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -o "dist/endlessnet-stun-smoke_${GITHUB_REF_NAME}_linux_${arch}" ./cmd/endlessnet-stun-smoke
          done
          cp LICENSE NOTICE THIRD_PARTY_NOTICES dist/
          (cd dist && sha256sum endlessnet-stun* > checksums.txt)
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive immutable image tags
        id: tags
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          major=${version%%.*}
          remainder=${version#*.}
          minor=${remainder%%.*}
          {
            echo "tags<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY}-public:${GITHUB_REF_NAME}"
            echo "ghcr.io/${GITHUB_REPOSITORY}-public:${major}.${minor}"
            echo "ghcr.io/${GITHUB_REPOSITORY}-public:${major}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/source-sbom.spdx.json
      - uses: actions/attest-build-provenance@v4
        if: ${{ github.event.repository.visibility == 'public' }}
        with:
          subject-path: dist/endlessnet-stun*
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
