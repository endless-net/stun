name: Deploy production

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact released semantic version, including v prefix
        required: true
        type: string
      target_host_or_group:
        description: Comma-separated SSH targets, updated sequentially
        required: true
        type: string
      stun_endpoints:
        description: Comma-separated public STUN endpoints matching targets
        required: true
        type: string
      metrics_bind_address:
        description: Host-local Vector scrape address
        required: true
        default: "127.0.0.1:9090"
        type: string
      deployment_strategy:
        description: Deployment strategy
        required: true
        default: rolling
        type: choice
        options: [rolling]
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      target_host_or_group:
        required: true
        type: string
      stun_endpoints:
        required: true
        type: string
      metrics_bind_address:
        required: true
        type: string
      deployment_strategy:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: endlessnet-stun-production
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - name: Verify merged PR provenance
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_VERSION: ${{ inputs.version }}
          DEPLOY_WORKFLOW_REF: ${{ github.event_name == 'workflow_dispatch' && github.ref || '' }}
        run: |
          args=(--version "$DEPLOY_VERSION")
          if [[ -n "$DEPLOY_WORKFLOW_REF" ]]; then
            args+=(--workflow-ref "$DEPLOY_WORKFLOW_REF")
          fi
          ./scripts/verify-production-provenance.sh "${args[@]}"
      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy exact version sequentially
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_VERSION: ${{ inputs.version }}
          DEPLOY_TARGETS: ${{ inputs.target_host_or_group }}
          DEPLOY_STUN_ENDPOINTS: ${{ inputs.stun_endpoints }}
          DEPLOY_METRICS_BIND_ADDRESS: ${{ inputs.metrics_bind_address }}
          DEPLOY_STRATEGY: ${{ inputs.deployment_strategy }}
        run: |
          args=(
            --version "$DEPLOY_VERSION"
            --targets "$DEPLOY_TARGETS"
            --stun-endpoints "$DEPLOY_STUN_ENDPOINTS"
            --strategy "$DEPLOY_STRATEGY"
          )
          args+=(--metrics-bind-address "$DEPLOY_METRICS_BIND_ADDRESS")
          ./scripts/deploy-prod.sh "${args[@]}"
