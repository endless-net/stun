name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - name: Verify modules
        run: go mod verify
      - name: Verify dependency licenses
        run: ./scripts/check-licenses.sh
      - name: Unit and integration tests
        run: go test ./...
      - name: Race tests
        run: >-
          docker run --rm --platform linux/amd64
          -v "$PWD:/src" -w /src
          -e GOTOOLCHAIN=local -e CGO_ENABLED=1
          golang:1.27.0-bookworm@sha256:ba5ef6614ca131b80a635fc6a7b715d9ee8a7f333debdbb81afb68259c7d48d4
          sh -ec 'git config --global --add safe.directory /src && go test -race ./...'
      - name: Vet
        run: go vet ./...
      - name: Build binaries
        run: go build ./cmd/endlessnet-stun ./cmd/endlessnet-stun-smoke
      - name: Lint deployment scripts
        run: docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d scripts/*.sh
      - name: Vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: 1.27.0
          go-package: ./...
          cache: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build container
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker buildx build --load --platform linux/amd64 --tag endlessnet-stun:ci .; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 5))
            fi
          done
          exit 1
      - name: Scan container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: endlessnet-stun:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Verify generated state is clean
        run: git diff --exit-code
