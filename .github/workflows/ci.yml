name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - name: Verify modules
        run: go mod verify
      - name: Verify dependency licenses
        run: ./scripts/check-licenses.sh
      - name: Unit and integration tests
        run: go test ./...
      - name: Race tests
        run: >-
          docker run --rm --platform linux/amd64
          -v "$PWD:/src" -w /src
          -e GOTOOLCHAIN=local -e CGO_ENABLED=1
          golang:1.26.5-bookworm@sha256:1ecb7edf62a0408027bd5729dfd6b1b8766e578e8df93995b225dfd0944eb651
          sh -ec 'git config --global --add safe.directory /src && go test -race ./...'
      - name: Vet
        run: go vet ./...
      - name: Build binaries
        run: go build ./cmd/endlessnet-stun ./cmd/endlessnet-stun-smoke
      - name: Lint deployment scripts
        run: docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d scripts/*.sh
      - name: Vulnerability scan
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: 1.26.5
          go-package: ./...
          cache: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build container
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker buildx build --load --platform linux/amd64 --tag endlessnet-stun:ci .; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 5))
            fi
          done
          exit 1
      - name: Scan container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: endlessnet-stun:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Verify generated state is clean
        run: git diff --exit-code
