name: Publish STUN production artifact

run-name: ${{ inputs.commit_sha }}

"on":
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full STUN main commit SHA to publish
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: stun-production-publication-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, attest, and publish immutable artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_digest: ${{ steps.bundle.outputs.artifact_digest }}
      package_digest: ${{ steps.metadata.outputs.package_digest }}
      provenance_reference: ${{ steps.bundle.outputs.provenance_reference }}
      sigstore_rekor_index: ${{ steps.sign.outputs.sigstore_rekor_index }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify publication commit
        env:
          PUBLISH_COMMIT_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PUBLISH_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$PUBLISH_COMMIT_SHA"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor HEAD refs/remotes/origin/main

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Resolve exact green CI evidence
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          PUBLISHER_COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          successful_ci_run() {
            local commit=$1
            local runs run_id
            runs=$(curl --fail --silent --show-error --get \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data-urlencode branch=main \
              --data-urlencode "head_sha=$commit" \
              --data-urlencode status=success \
              --data-urlencode per_page=100 \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs")
            run_id=$(jq -r --arg commit "$commit" '
              [.workflow_runs[] |
                select(.head_sha == $commit and .head_branch == "main" and
                  .path == ".github/workflows/ci.yml" and
                  .status == "completed" and .conclusion == "success")][0].id // empty
            ' <<<"$runs")
            test -n "$run_id" || {
              echo "::error::no successful main CI run exists for exact commit $commit"
              exit 1
            }
            printf '%s' "$run_id"
          }
          commit_ci_run_id=$(successful_ci_run "$COMMIT_SHA")
          publisher_ci_run_id=$(successful_ci_run "$PUBLISHER_COMMIT_SHA")
          {
            echo "commit_ci_run_id=$commit_ci_run_id"
            echo "publisher_ci_run_id=$publisher_ci_run_id"
          } >>"$GITHUB_OUTPUT"

      - name: Verify release source
        run: ./scripts/verify.sh
      - name: Require exact-commit product E2E
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: bash scripts/verify-e2e-evidence.sh "$COMMIT_SHA"

      - name: Build immutable deployment bundle
        id: bundle
        env:
          PUBLISH_COMMIT_SHA: ${{ inputs.commit_sha }}
          COMMIT_CI_RUN_ID: ${{ steps.ci.outputs.commit_ci_run_id }}
          PUBLISHER_CI_RUN_ID: ${{ steps.ci.outputs.publisher_ci_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          release_id=$(git rev-parse HEAD)
          test "$release_id" = "$PUBLISH_COMMIT_SHA"
          artifact_name="endlessnet-stun-$release_id"
          stage="$RUNNER_TEMP/$artifact_name"
          install -d \
            "$stage/bin/linux-amd64" \
            "$stage/bin/linux-arm64" \
            "$stage/systemd"
          source_date_epoch=$(git show -s --format=%ct HEAD)
          build_date=$(date -u -d "@$source_date_epoch" +%Y-%m-%dT%H:%M:%SZ)
          version="commit-${release_id:0:12}"
          ldflags="-s -w -X main.version=$version -X main.commit=$release_id -X main.buildDate=$build_date"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -buildvcs=true -ldflags="$ldflags" \
              -o "$stage/bin/linux-$arch/endlessnet-stun" \
              ./cmd/endlessnet-stun
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -buildvcs=true -ldflags="-s -w" \
              -o "$stage/bin/linux-$arch/endlessnet-stun-smoke" \
              ./cmd/endlessnet-stun-smoke
          done
          install -m 0644 deploy/systemd/endlessnet-stun.service "$stage/systemd/"
          install -m 0644 LICENSE NOTICE THIRD_PARTY_NOTICES "$stage/"

          archive_name="$artifact_name.tar.gz"
          archive="$RUNNER_TEMP/$archive_name"
          checksum="$archive.sha256"
          manifest="$RUNNER_TEMP/$artifact_name.manifest.json"
          provenance="$RUNNER_TEMP/$archive_name.intoto.json"
          provenance_bundle="$RUNNER_TEMP/$archive_name.provenance.sigstore.json"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$source_date_epoch" -C "$stage" -czf "$archive" .
          archive_sha256=$(sha256sum "$archive" | awk '{print $1}')
          printf '%s  %s\n' "$archive_sha256" "$archive_name" >"$checksum"
          (
            cd "$RUNNER_TEMP"
            sha256sum -c "$(basename "$checksum")"
          )

          jq -n \
            --arg schema_version 1 \
            --arg service stun \
            --arg producer_repository "$GITHUB_REPOSITORY" \
            --arg producer_workflow .github/workflows/publish-production.yml \
            --arg producer_run_id "$GITHUB_RUN_ID" \
            --arg commit_ci_run_id "$COMMIT_CI_RUN_ID" \
            --arg publisher_workflow_commit "$GITHUB_SHA" \
            --arg publisher_ci_run_id "$PUBLISHER_CI_RUN_ID" \
            --arg commit_sha "$release_id" \
            --arg artifact_name "$artifact_name" \
            --arg artifact_digest "sha256:$archive_sha256" \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema_version: ($schema_version | tonumber),
              service: $service,
              producer_repository: $producer_repository,
              producer_workflow: $producer_workflow,
              producer_run_id: ($producer_run_id | tonumber),
              commit_ci_run_id: ($commit_ci_run_id | tonumber),
              publisher_workflow_commit: $publisher_workflow_commit,
              publisher_ci_run_id: ($publisher_ci_run_id | tonumber),
              commit_sha: $commit_sha,
              artifact_name: $artifact_name,
              artifact_digest: $artifact_digest,
              architectures: ["amd64", "arm64"],
              created_at: $created_at
            }' >"$manifest"

          jq -n \
            --arg archive_name "$archive_name" \
            --arg archive_sha256 "$archive_sha256" \
            --arg producer_repository "$GITHUB_REPOSITORY" \
            --arg producer_workflow .github/workflows/publish-production.yml \
            --arg producer_run_id "$GITHUB_RUN_ID" \
            --arg commit_ci_run_id "$COMMIT_CI_RUN_ID" \
            --arg publisher_workflow_commit "$GITHUB_SHA" \
            --arg publisher_ci_run_id "$PUBLISHER_CI_RUN_ID" \
            --arg commit_sha "$release_id" \
            --arg invocation_id "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{
              _type: "https://in-toto.io/Statement/v1",
              subject: [{name: $archive_name, digest: {sha256: $archive_sha256}}],
              predicateType: "https://slsa.dev/provenance/v1",
              predicate: {
                buildDefinition: {
                  buildType: "https://endlessnet.ru/build-types/stun-linux-systemd-archive/v1",
                  externalParameters: {commit_sha: $commit_sha},
                  internalParameters: {
                    producer_repository: $producer_repository,
                    producer_workflow: $producer_workflow,
                    producer_run_id: ($producer_run_id | tonumber),
                    commit_ci_run_id: ($commit_ci_run_id | tonumber),
                    publisher_workflow_commit: $publisher_workflow_commit,
                    publisher_ci_run_id: ($publisher_ci_run_id | tonumber)
                  },
                  resolvedDependencies: [{
                    uri: ("git+https://github.com/" + $producer_repository),
                    digest: {gitCommit: $commit_sha}
                  }]
                },
                runDetails: {
                  builder: {
                    id: ("https://github.com/" + $producer_repository + "/" + $producer_workflow + "@refs/heads/main")
                  },
                  metadata: {invocationId: $invocation_id}
                }
              }
            }' >"$provenance"

          {
            echo "archive=$archive"
            echo "checksum=$checksum"
            echo "manifest=$manifest"
            echo "provenance=$provenance"
            echo "provenance_bundle=$provenance_bundle"
            echo "provenance_reference=$(basename "$provenance")#$(basename "$provenance_bundle")"
            echo "artifact_digest=sha256:$archive_sha256"
          } >>"$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v4.1.2

      - name: Sign and verify archive provenance
        id: sign
        env:
          MANIFEST: ${{ steps.bundle.outputs.manifest }}
          PROVENANCE: ${{ steps.bundle.outputs.provenance }}
          PROVENANCE_BUNDLE: ${{ steps.bundle.outputs.provenance_bundle }}
        shell: bash
        run: |
          set -euo pipefail
          certificate_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/publish-production.yml@refs/heads/main"
          certificate_issuer=https://token.actions.githubusercontent.com
          cosign sign-blob --yes --bundle "$PROVENANCE_BUNDLE" "$PROVENANCE"
          cosign verify-blob \
            --bundle "$PROVENANCE_BUNDLE" \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer "$certificate_issuer" \
            "$PROVENANCE"
          sigstore_rekor_index=$(jq -r '
            if .verificationMaterial.tlogEntries? then
              .verificationMaterial.tlogEntries[0].logIndex
            elif .rekorBundle.Payload.logIndex? then
              .rekorBundle.Payload.logIndex
            else
              empty
            end
          ' "$PROVENANCE_BUNDLE")
          [[ "$sigstore_rekor_index" =~ ^[1-9][0-9]*$ ]]
          updated="$RUNNER_TEMP/publication-manifest.json"
          jq \
            --arg provenance_statement "$(basename "$PROVENANCE")" \
            --arg provenance_bundle "$(basename "$PROVENANCE_BUNDLE")" \
            --arg certificate_identity "$certificate_identity" \
            --arg certificate_issuer "$certificate_issuer" \
            --arg sigstore_rekor_index "$sigstore_rekor_index" \
            '. + {provenance: {
              statement: $provenance_statement,
              sigstore_bundle: $provenance_bundle,
              certificate_identity: $certificate_identity,
              certificate_issuer: $certificate_issuer,
              rekor_log_index: ($sigstore_rekor_index | tonumber)
            }}' "$MANIFEST" >"$updated"
          mv "$updated" "$MANIFEST"
          echo "sigstore_rekor_index=$sigstore_rekor_index" >>"$GITHUB_OUTPUT"

      - name: Test production artifact contract
        env:
          ARTIFACT_DIR: ${{ runner.temp }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          COMMIT_CI_RUN_ID: ${{ steps.ci.outputs.commit_ci_run_id }}
          PRODUCER_REPOSITORY: ${{ github.repository }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          PUBLISHER_COMMIT_SHA: ${{ github.sha }}
          PUBLISHER_CI_RUN_ID: ${{ steps.ci.outputs.publisher_ci_run_id }}
          ARTIFACT_DIGEST: ${{ steps.bundle.outputs.artifact_digest }}
          SIGSTORE_REKOR_INDEX: ${{ steps.sign.outputs.sigstore_rekor_index }}
        shell: bash
        run: bash scripts/verify-production-artifact.sh

      - name: Upload immutable artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: endlessnet-stun-${{ inputs.commit_sha }}
          path: |
            ${{ steps.bundle.outputs.archive }}
            ${{ steps.bundle.outputs.checksum }}
            ${{ steps.bundle.outputs.manifest }}
            ${{ steps.bundle.outputs.provenance }}
            ${{ steps.bundle.outputs.provenance_bundle }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish immutable artifact metadata
        id: metadata
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          RAW_PACKAGE_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_DIGEST: ${{ steps.bundle.outputs.artifact_digest }}
          PROVENANCE_REFERENCE: ${{ steps.bundle.outputs.provenance_reference }}
          COMMIT_CI_RUN_ID: ${{ steps.ci.outputs.commit_ci_run_id }}
          PUBLISHER_COMMIT_SHA: ${{ github.sha }}
          PUBLISHER_CI_RUN_ID: ${{ steps.ci.outputs.publisher_ci_run_id }}
          SIGSTORE_REKOR_INDEX: ${{ steps.sign.outputs.sigstore_rekor_index }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RAW_PACKAGE_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            package_digest="sha256:$RAW_PACKAGE_DIGEST"
          else
            package_digest=$RAW_PACKAGE_DIGEST
          fi
          [[ "$package_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "package_digest=$package_digest" >>"$GITHUB_OUTPUT"
          {
            echo '### STUN immutable production artifact'
            echo
            echo "- schema_version: 1"
            echo "- service: stun"
            echo "- commit_sha: $COMMIT_SHA"
            echo "- producer_run_id: $GITHUB_RUN_ID"
            echo "- commit_ci_run_id: $COMMIT_CI_RUN_ID"
            echo "- publisher_commit_sha: $PUBLISHER_COMMIT_SHA"
            echo "- publisher_ci_run_id: $PUBLISHER_CI_RUN_ID"
            echo "- package_digest: $package_digest"
            echo "- artifact_digest: $ARTIFACT_DIGEST"
            echo "- provenance_reference: $PROVENANCE_REFERENCE"
            echo "- sigstore_rekor_index: $SIGSTORE_REKOR_INDEX"
          } >>"$GITHUB_STEP_SUMMARY"
